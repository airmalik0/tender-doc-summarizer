[project]
name = "tender-doc-summarizer"
version = "1.0.0"
description = "Извлечение ключевых условий из документации госзакупок (сумма, сроки, требования, штрафы)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Malik Yuldashev", email = "maik.yuldashev2004@gmail.com" }]

dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "python-multipart>=0.0.32",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    # Разбор PDF: текстовый слой и рендер страниц для OCR
    "pypdfium2>=5.13,<6.0",
    "pytesseract>=0.3.13,<0.4",
    "pillow>=12.0,<13.0",
    # LLM-провайдеры. Все три опциональны в рантайме: сервис поднимается
    # и работает в offline-режиме, даже если ни один ключ не задан.
    "anthropic>=1.0,<2.0",
    "openai>=3.0,<4.0",
    "google-genai>=2.19,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "black>=24.10",
    "mypy>=1.13",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/", "^scripts/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
