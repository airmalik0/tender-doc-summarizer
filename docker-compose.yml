# Запуск одной командой:
#
#     docker compose up --build
#
# Интерфейс — http://localhost:8000, документация API — /docs.
#
# Ключ LLM не обязателен: без него сервис поднимется и будет разбирать
# документы детерминированными правилами. Чтобы включить полноценное
# извлечение, скопируйте .env.example в .env и впишите ANTHROPIC_API_KEY —
# compose подхватит .env автоматически.

services:
  api:
    build: .
    image: tender-doc-summarizer:latest
    container_name: tender-summarizer
    ports:
      # Привязка к петлевому интерфейсу: сервис не спрашивает пароля, и
      # публиковать его на всю локальную сеть незачем. Нужен доступ снаружи —
      # поменяйте на "${PORT:-8000}:8000".
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-auto}"

      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-opus-5}"
      ANTHROPIC_EFFORT: "${ANTHROPIC_EFFORT:-medium}"

      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4o}"

      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.5-flash}"

      OCR_ENABLED: "${OCR_ENABLED:-true}"
      OCR_LANG: "${OCR_LANG:-rus+eng}"
      OCR_DPI: "${OCR_DPI:-220}"
      OCR_MIN_CHARS_PER_PAGE: "${OCR_MIN_CHARS_PER_PAGE:-120}"

      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      MAX_PAGES: "${MAX_PAGES:-400}"
      MAX_DOCUMENT_CHARS: "${MAX_DOCUMENT_CHARS:-1500000}"
      MAX_RENDER_PIXELS: "${MAX_RENDER_PIXELS:-40000000}"
      CHUNK_CHARS: "${CHUNK_CHARS:-14000}"
      CHUNK_OVERLAP_CHARS: "${CHUNK_OVERLAP_CHARS:-800}"
      MAX_CHUNKS: "${MAX_CHUNKS:-12}"
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-180}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-2}"

      CACHE_ENABLED: "${CACHE_ENABLED:-true}"
      CACHE_DIR: "/app/data/cache"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      # Кэш разборов переживает пересоздание контейнера: повторная загрузка
      # того же файла не стоит ни секунды, ни токена.
      - tender-cache:/app/data/cache
    # Предел памяти — последняя линия обороны. Разбор PDF идёт внутри pdfium,
    # и специально собранный документ успевает раздуть его память до того, как
    # приложение вообще получит управление. Ограничение превращает такую
    # загрузку в перезапуск контейнера вместо съеденной памяти хоста.
    mem_limit: 4g
    restart: unless-stopped

volumes:
  tender-cache:
